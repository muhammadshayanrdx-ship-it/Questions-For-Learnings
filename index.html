<!DOCTYPE html>
<!--nothing-->
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1"
>

<title>
Question Manager
</title>


<style>

*{

box-sizing:border-box;

}


body{

margin:0;

font-family:

Arial,

sans-serif;


background:

linear-gradient(

135deg,

#071426,

#102b46

);


color:white;

min-height:100vh;

}


header{

text-align:center;

padding:

50px 20px;

}


header h1{

font-size:

42px;

margin:0;

color:

#38bdf8;

}


header p{

color:

#b8c5d6;

}


.container{

max-width:

900px;

margin:auto;

padding:

20px;

}


.card{

background:

#122238;

padding:

25px;

border-radius:

15px;

margin-bottom:

25px;

box-shadow:

0 10px 30px

rgba(

0,

0,

0,

0.3

);

}


label{

display:block;

margin-top:

15px;

margin-bottom:

7px;

font-weight:bold;

}


textarea{

width:100%;

padding:15px;

border-radius:

10px;

border:

1px solid

#334b66;

background:

#081525;

color:white;

font-size:

16px;

min-height:

110px;

resize:vertical;

}


textarea:focus{

outline:none;

border-color:

#38bdf8;

}


button{

padding:

12px 20px;

border:none;

border-radius:

8px;

font-weight:bold;

cursor:pointer;

color:white;

margin-top:

15px;

}


.save{

background:

#0284c7;

}


.cancel{

background:

#64748b;

display:none;

}


.edit{

background:

#e28a00;

}


.delete{

background:

#dc2626;

}


input{

width:100%;

padding:

14px;

border-radius:

9px;

border:

1px solid

#334b66;

background:

#081525;

color:white;

font-size:

16px;

margin-bottom:

20px;

}


.question{

background:

#081525;

padding:

20px;

border-radius:

12px;

margin-top:

15px;

border:

1px solid

#263d56;
     overflow: scroll;

}


.question h3{

color:

#38bdf8;

}


.answer{

white-space:

pre-wrap;

line-height:

1.6;
     overflow: scroll;

}


.buttons{

display:flex;

gap:

10px;

}


.loading{

text-align:center;

color:

#9db0c6;

padding:

30px;

}


.message{

padding:

13px;

border-radius:

8px;

margin-top:

15px;

display:none;

}


.success{

display:block;

background:

#14532d;

}


.error{

display:block;

background:

#7f1d1d;

}


@media(

max-width:600px

){


header h1{

font-size:

32px;

}


.card{

padding:

18px;

}


.buttons{

flex-direction:

column;

}


button{

width:100%;

}


}


</style>

</head>


<body>


<header>

<h1>

Question Manager

</h1>


<p>

Save questions and answers

using Google Sheets

</p>

</header>



<div class="container">


<div class="card">


<h2 id="title">

Add Question

</h2>


<input

type="hidden"

id="editID"

>


<label>

Question

</label>


<textarea

id="question"

placeholder=

"Enter your question"

></textarea>


<label>

Answer

</label>


<textarea

id="answer"

placeholder=

"Enter the answer"

></textarea>


<button

class="save"

onclick="saveQuestion()"

id="saveButton"

>

Save Question

</button>


<button

class="cancel"

onclick="cancelEdit()"

id="cancelButton"

>

Cancel

</button>


<div

id="message"

class="message"

></div>


</div>



<div class="card">


<h2>

Saved Questions

</h2>


<input

id="search"

placeholder=

"Search questions..."

oninput=

"displayQuestions()"

>


<div

id="list"

class="loading"

>

Loading questions...

</div>


</div>


</div>



<script>


/*

PASTE YOUR GOOGLE

APPS SCRIPT URL BELOW

*/


const API_URL =

"https://script.google.com/macros/s/AKfycbw9cfFE0rm36xuwBTHeTfIHUKmv5WIIFg2_sps8y9zSZmktw3o-wlJCmtpMu-OSTM4K_Q/exec";



/*

USE THE SAME KEY

FROM CODE.GS

*/


const APP_KEY =

"CHANGE_THIS_TO_YOUR_PRIVATE_KEY_84729";



let questions = [];



async function

loadQuestions(){

try{


document

.getElementById(

"list"

)

.innerHTML =

"Loading questions...";



const response =

await fetch(

API_URL

+

"?action=getQuestions"

+

"&key="

+

encodeURIComponent(

APP_KEY

)

);


const data =

await response.json();



if(

!data.success

){

throw new Error(

data.message

);

}



questions =

data.questions;



displayQuestions();



}

catch(error){


document

.getElementById(

"list"

)

.innerHTML =

"Unable to load questions."


showMessage(

error.message,

"error"

);


}


}



function

displayQuestions(){


const search =

document

.getElementById(

"search"

)

.value

.toLowerCase();



const filtered =

questions.filter(

item =>


item.question

.toLowerCase()

.includes(

search

)


||


item.answer

.toLowerCase()

.includes(

search

)


);



const list =

document

.getElementById(

"list"

);



list.innerHTML = "";



if(

filtered.length === 0

){


list.innerHTML =

"No questions found.";


return;


}



filtered.forEach(

item => {


const box =

document

.createElement(

"div"

);



box.className =

"question";



const title =

document

.createElement(

"h3"

);



title.textContent =

item.question;



const answer =

document

.createElement(

"div"

);



answer.className =

"answer";



answer.textContent =

item.answer;



const buttons =

document

.createElement(

"div"

);



buttons.className =

"buttons";



const edit =

document

.createElement(

"button"

);



edit.className =

"edit";



edit.textContent =

"Edit";



edit.onclick =

()=>editQuestion(

item.id

);



const remove =

document

.createElement(

"button"

);



remove.className =

"delete";



remove.textContent =

"Delete";



remove.onclick =

()=>deleteQuestion(

item.id

);



buttons.append(

edit,

remove

);



box.append(

title,

answer,

buttons

);



list.append(

box

);



});


}



async function

saveQuestion(){


const question =

document

.getElementById(

"question"

)

.value.trim();



const answer =

document

.getElementById(

"answer"

)

.value.trim();



const id =

document

.getElementById(

"editID"

)

.value;



if(

!question

||

!answer

){


showMessage(

"Enter both question and answer.",

"error"

);


return;


}



const action =

id

?

"updateQuestion"

:

"addQuestion";



const data = {


key:

APP_KEY,


action:


action,


id:


id,


question:


question,


answer:


answer


};



try{


document

.getElementById(

"saveButton"

)

.disabled = true;



const response =

await fetch(

API_URL,

{


method:

"POST",


body:

JSON.stringify(

data

)


}

);



const result =

await response.json();



if(

!result.success

){

throw new Error(

result.message

);

}



showMessage(

result.message,

"success"

);



cancelEdit();



await loadQuestions();



}

catch(error){


showMessage(

error.message,

"error"

);


}



document

.getElementById(

"saveButton"

)

.disabled = false;


}



function

editQuestion(id){


const item =

questions.find(

question =>

question.id === id

);



document

.getElementById(

"editID"

)

.value =

item.id;



document

.getElementById(

"question"

)

.value =

item.question;



document

.getElementById(

"answer"

)

.value =

item.answer;



document

.getElementById(

"title"

)

.innerText =

"Edit Question";



document

.getElementById(

"saveButton"

)

.innerText =

"Save Changes";



document

.getElementById(

"cancelButton"

)

.style.display =

"inline-block";



window.scrollTo({

top:0,

behavior:

"smooth"

});


}



function

cancelEdit(){


document

.getElementById(

"editID"

)

.value = "";



document

.getElementById(

"question"

)

.value = "";



document

.getElementById(

"answer"

)

.value = "";



document

.getElementById(

"title"

)

.innerText =

"Add Question";



document

.getElementById(

"saveButton"

)

.innerText =

"Save Question";



document

.getElementById(

"cancelButton"

)

.style.display =

"none";


}



async function

deleteQuestion(id){


const confirmDelete =

confirm(

"Delete this question?"

);



if(

!confirmDelete

){

return;

}



try{


const response =

await fetch(

API_URL,

{


method:

"POST",


body:

JSON.stringify({


key:

APP_KEY,


action:

"deleteQuestion",


id:

id


})


});



const result =

await response.json();



if(

!result.success

){

throw new Error(

result.message

);

}



showMessage(

result.message,

"success"

);



loadQuestions();



}

catch(error){


showMessage(

error.message,

"error"

);


}


}



function

showMessage(

text,

type

){


const message =

document

.getElementById(

"message"

);



message.innerText =

text;



message.className =

"message "

+

type;



setTimeout(

()=>{


message.className =

"message";


},

4000

);


}



loadQuestions();


</script>



</body>

</html>
